      - export PUB_CACHE=$HOME/.pub-cache
      - $$rustup$$/rustup-init.sh -y --default-toolchain stable --target aarch64-linux-android
      - source $HOME/.cargo/env
      - bash tool/repro_build.sh $$flutter$$/bin/flutter
