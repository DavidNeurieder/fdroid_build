# Pinned toolchain versions for Against Yesterday F-Droid builds.
#
# This file is the single source of truth for toolchain versions used in the
# F-Droid build recipe (apps/AgainstYesterday/metadata.yml).  Update it when
# bumping Flutter, Rust, or the Android NDK, and keep metadata.yml in sync.
#
# The metadata.yml uses "stable" channels so F-Droid's auto-update keeps
# working; these pins document the versions that were validated for a release.

flutter: "3.41.2"
rustup: "1.25.2"
rust-toolchain: "1.98.1"
ndk: "28.2.13676358"
jdk: "21"
android-target: "aarch64-linux-android"
android-abi: "arm64-v8a"